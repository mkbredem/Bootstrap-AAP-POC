---
- name: Prepare RHEL 9/10 host for AAP Containerized Installation (Section 4.3)
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - secrets.yml

  vars:
    supported_versions:
      - "9"
      - "10"

  pre_tasks:
    - name: Ensure OS is RHEL 9 or 10
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version in supported_versions
        fail_msg: "This system must be RHEL 9 or RHEL 10."

    - name: Validate secrets.yml values
      ansible.builtin.assert:
        that:
          - aap_user is defined
          - aap_password is defined
          - aap_fqdn is defined
          - aap_user | trim | length > 0
          - aap_password | trim | length > 0
          - aap_fqdn | trim | length > 0
          - not (aap_password | regex_search('<CHANGE_ME'))
          - not (aap_fqdn | regex_search('<CHANGE_ME'))
        fail_msg: |
          secrets.yml contains placeholder values.
          Update the following variables before running installation:
            aap_password
            aap_fqdn

    - name: Validate aap_fqdn format
      ansible.builtin.assert:
        that:
          - aap_fqdn is match("^[a-zA-Z0-9.-]+\\.[a-zA-Z]{2,}$")
        fail_msg: "aap_fqdn must be a valid FQDN (example: aap.example.com)"

  tasks:
    ###################################################################
    # Determine install user
    ###################################################################
    - name: Determine install user
      set_fact:
        install_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

    - name: Show install user
      debug:
        msg: "Bootstrap installer running as user: {{ install_user }}"

    ###################################################################
    # Optional: RHSM Registration
    ###################################################################
    - name: Check if host is already registered with subscription-manager
      ansible.builtin.command: subscription-manager status
      register: rhsm_status
      ignore_errors: true
      changed_when: false

    - name: Register with subscription-manager using activation key
      ansible.builtin.command: >
        subscription-manager register
        --org={{ rhsm_org }}
        --activationkey={{ rhsm_activation_key }}
        --force
      when:
        - rhsm_status.rc != 0
        - rhsm_org is defined and rhsm_org | trim | length > 0
        - rhsm_activation_key is defined and rhsm_activation_key | trim | length > 0
      no_log: true

    - name: Register with subscription-manager using username/password
      ansible.builtin.command: >
        subscription-manager register
        --username={{ rhsm_username }}
        --password={{ rhsm_password }}
        --force
      when:
        - rhsm_status.rc != 0
        - rhsm_org is not defined or rhsm_org | trim | length == 0
        - rhsm_activation_key is not defined or rhsm_activation_key | trim | length == 0
        - rhsm_username is defined and rhsm_username | trim | length > 0
        - rhsm_password is defined and rhsm_password | trim | length > 0
      no_log: true

    ###################################################################
    # Install prerequisites if missing
    ###################################################################
    - name: Check ansible-core
      ansible.builtin.command: rpm -q ansible-core
      register: ansible_core_check
      ignore_errors: true
      changed_when: false

    - name: Install ansible-core if missing
      ansible.builtin.dnf:
        name: ansible-core
        state: present
      when: ansible_core_check.rc != 0

    - name: Check podman
      ansible.builtin.command: podman --version
      register: podman_check
      ignore_errors: true
      changed_when: false

    - name: Install podman if missing
      ansible.builtin.dnf:
        name: podman
        state: present
      when: podman_check.rc != 0

    ###################################################################
    # Force systemd linger for install user
    ###################################################################
    - name: Enable linger for install user
      command: loginctl enable-linger {{ install_user }}
      ignore_errors: yes

    - name: Verify linger enabled
      command: loginctl show-user {{ install_user }} -p Linger
      register: linger_status
      changed_when: false

    - name: Fail if linger not enabled
      assert:
        that:
          - "'Linger=yes' in linger_status.stdout"
        fail_msg: "Linger must be enabled for {{ install_user }}"

    ###################################################################
    # Set Hostname / FQDN
    ###################################################################
    - name: Set system hostname to AAP FQDN
      ansible.builtin.hostname:
        name: "{{ aap_fqdn }}"

    - name: Ensure /etc/hosts contains FQDN entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ aap_fqdn }}"
        state: present

    - name: Verify hostname -f returns FQDN
      ansible.builtin.command: hostname -f
      register: fqdn_check
      changed_when: false

    - name: Fail if hostname is not FQDN
      ansible.builtin.assert:
        that:
          - fqdn_check.stdout == aap_fqdn
        fail_msg: "hostname -f does not match aap_fqdn"

    ###################################################################
    # Validate BaseOS and AppStream repositories (RHSM or RHUI)
    ###################################################################
    - name: Get enabled repositories
      ansible.builtin.command: dnf repolist --enabled
      register: enabled_repos
      changed_when: false

    - name: Extract repo IDs
      ansible.builtin.set_fact:
        enabled_repo_ids: >-
          {{
            enabled_repos.stdout_lines
            | map('regex_replace', '\\s+.*$', '')
            | select('match', '^(rhel|rhui)')
            | list
          }}

    - name: Show enabled repos
      ansible.builtin.debug:
        var: enabled_repo_ids

    - name: Ensure BaseOS repo exists
      ansible.builtin.assert:
        that:
          - enabled_repo_ids | select('search','baseos') | list | length > 0
        fail_msg: "BaseOS repository not enabled."

    - name: Ensure AppStream repo exists
      ansible.builtin.assert:
        that:
          - enabled_repo_ids | select('search','appstream') | list | length > 0
        fail_msg: "AppStream repository not enabled."

    ###################################################################
    # Locate, clean, and extract AAP setup bundle
    ###################################################################
    - name: Find AAP setup bundle
      find:
        paths: "{{ playbook_dir }}/files"
        patterns: "*.tar.gz*"
        file_type: file
      register: bundle_files

    - name: Ensure exactly one bundle exists
      assert:
        that:
          - bundle_files.matched == 1
        fail_msg: "Expected exactly one setup bundle in files/ directory."

    - name: Set bundle file variables
      set_fact:
        bundle_full_path: "{{ bundle_files.files[0].path }}"
        bundle_filename: "{{ bundle_files.files[0].path | basename }}"

    - name: Create cleaned bundle filename
      set_fact:
        bundle_clean_name: "{{ bundle_filename | regex_replace('\\?.*$', '') }}"

    - name: Rename bundle file if downloaded via wget
      command:
        cmd: mv "{{ bundle_full_path }}" "{{ playbook_dir }}/files/{{ bundle_clean_name }}"
      when: bundle_filename != bundle_clean_name

    - name: Set final bundle path
      set_fact:
        bundle_final_path: "{{ playbook_dir }}/files/{{ bundle_clean_name }}"

    - name: Extract setup bundle to install user home directory
      unarchive:
        src: "{{ bundle_final_path }}"
        dest: "/home/{{ install_user }}/"
        remote_src: true
        owner: "{{ install_user }}"
        group: "{{ install_user }}"

    - name: Find extracted setup directory
      find:
        paths: "/home/{{ install_user }}"
        file_type: directory
        patterns: "ansible-automation-platform-containerized-*"
      register: extracted_dir

    - name: Fail if extracted directory not found
      assert:
        that:
          - extracted_dir.files | length > 0
        fail_msg: "Could not find extracted AAP setup directory under /home/{{ install_user }}/"

    - name: Set extracted directory path
      set_fact:
        aap_setup_dir: "{{ extracted_dir.files[0].path }}"

    - name: Show extracted directory
      debug:
        msg: "AAP setup extracted to {{ aap_setup_dir }}"

    ###################################################################
    # Find and validate manifest zip
    ###################################################################
    - name: Find manifest zip file
      find:
        paths: "{{ playbook_dir }}/files"
        recurse: no
        patterns: "manifest_*.zip"
      register: manifest_files

    - name: Assert manifest zip was found
      assert:
        that:
          - manifest_files.files | length > 0
        fail_msg: |
          No manifest_*.zip found in files/ directory.
          Download your subscription manifest from Red Hat Customer Portal and place it in files/.

    - name: Set manifest filename
      set_fact:
        manifest_zip: "{{ manifest_files.files[0].path | basename }}"

    ############################################################
    # Render and copy CAC postinstall directory into bundle directory
    ############################################################
    - name: Create cac directory in bundle
      file:
        path: "{{ aap_setup_dir }}/cac"
        state: directory
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: '0755'

    - name: Render CaC templates into bundle cac directory
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ aap_setup_dir }}/cac/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: '0644'
      with_fileglob:
        - "{{ playbook_dir }}/files/cac/*.yaml.j2"

    ###################################################################
    # Copy and render inventory file into extracted bundle directory
    ###################################################################
    - name: Render inventory-growth from template
      ansible.builtin.template:
        src: inventory-growth.j2
        dest: "{{ aap_setup_dir }}/inventory-growth"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: '0644'

    - name: Show inventory location
      ansible.builtin.debug:
        msg: "Inventory file created at {{ aap_setup_dir }}/inventory-growth"

  post_tasks:
    - name: Completion message
      ansible.builtin.debug:
        msg:
          - "RHEL host preparation for Containerized AAP complete."
          - "Hostname set to: {{ aap_fqdn }}"
          - "Repositories verified."
          - "Setup bundle extracted to: {{ aap_setup_dir }}"
          - "CaC resources rendered and staged."

    - name: Save facts for later plays
      set_fact:
        vault_pass_for_encrypt: "{{ aap_password }}"
        aap_setup_dir_for_install: "{{ aap_setup_dir }}"
        install_user_for_install: "{{ install_user }}"


##############################################
# PLAY 2 - Encrypt secrets.yml
##############################################
- name: Encrypt secrets file
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check if secrets.yml already encrypted
      slurp:
        src: secrets.yml
      register: secrets_file
      no_log: true

    - name: Determine encryption status
      set_fact:
        secrets_encrypted: "{{ (secrets_file.content | b64decode).startswith('$ANSIBLE_VAULT;') }}"
      no_log: true

    - name: Create vault password file
      copy:
        dest: /tmp/.vault_pass
        content: "{{ hostvars[groups['all'][0]].vault_pass_for_encrypt }}"
        mode: '0600'
      when: not secrets_encrypted

    - name: Encrypt secrets.yml
      command: ansible-vault encrypt secrets.yml --vault-password-file /tmp/.vault_pass
      when: not secrets_encrypted
      no_log: true

    - name: Remove vault password file
      file:
        path: /tmp/.vault_pass
        state: absent
      when: not secrets_encrypted
      no_log: true

