---
- name: AAP 2.6 Containerized Growth Topology (Bundled) Precheck
  hosts: all
  gather_facts: yes

  vars:
    min_rhel_version: "9.4"
    min_cpu: 4
    min_mem_mb: 16384
    min_mem_seed_mb: 32768
    min_disk_bytes: 64424509440        # 60 GB
    min_install_bytes: 16106127360     # 15 GB
    min_vartmp_bytes: 3221225472       # 3 GB
    min_tmp_bytes: 10737418240         # 10 GB

    install_dir: "{{ ansible_env.HOME }}"
    tmp_dir: "{{ lookup('env','TMPDIR') | default('/tmp', true) }}"

  tasks:

    - name: Initialize results list
      set_fact:
        precheck_results: []

    ############################################################
    # USER CHECK
    ############################################################
    - name: Check non-root user
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Execution user"
          desired: "Must be non-root dedicated install user"
          observed: "User={{ ansible_user_id }}, UID={{ ansible_user_uid }}"
          status: "{{ 'PASS' if ansible_user_uid != 0 else 'FAIL' }}"

    ############################################################
    # SUDO CHECK
    ############################################################
    - name: Check sudo availability
      command: sudo -n true
      register: sudo_check
      ignore_errors: true
      changed_when: false

    - name: Record sudo result
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Privilege escalation"
          desired: "User should have sudo access"
          observed: "{{ 'passwordless sudo works' if sudo_check.rc == 0 else 'sudo requires password or unavailable' }}"
          status: "{{ 'PASS' if sudo_check.rc == 0 else 'WARN' }}"

    ############################################################
    # OS CHECK
    ############################################################
    - name: Check RHEL version
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Operating system"
          desired: "RHEL >= {{ min_rhel_version }}"
          observed: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          status: >-
            {{
              'PASS'
              if (ansible_distribution == 'RedHat' and
                  ansible_distribution_version is version(min_rhel_version, '>=')) 
              else 'FAIL'
            }}

    ############################################################
    # CPU CHECK
    ############################################################
    - name: Check CPU count
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "CPU"
          desired: ">= {{ min_cpu }} vCPUs"
          observed: "{{ ansible_processor_vcpus }} CPUs"
          status: "{{ 'PASS' if ansible_processor_vcpus | int >= min_cpu else 'FAIL' }}"

    ############################################################
    # MEMORY CHECK
    ############################################################
    - name: Check memory
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Memory"
          desired: ">= 16GB (32GB recommended if seeding)"
          observed: "{{ ansible_memtotal_mb }} MB"
          status: "{{ 'PASS' if ansible_memtotal_mb | int >= min_mem_mb else 'FAIL' }}"

    ############################################################
    # DISK CHECK (TOTAL)
    ############################################################
    - name: Calculate total disk space
      set_fact:
        total_disk_bytes: "{{ ansible_mounts | map(attribute='size_available') | sum }}"

    - name: Record total disk check
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Total disk"
          desired: ">= 60GB available"
          observed: "{{ (total_disk_bytes | int / 1024 / 1024 / 1024) | round(2) }} GB"
          status: "{{ 'PASS' if total_disk_bytes | int >= min_disk_bytes else 'FAIL' }}"

    ############################################################
    # INSTALL DISK CHECK
    # All directories (~/, /tmp, /var/tmp) reside on the same filesystem; validating root filesystem capacity.”
    ############################################################
    - name: Get install dir stats
      stat:
        path: "{{ install_dir }}"
      register: install_stat

    - name: Get root mount
      set_fact:
        root_mount: "{{ ansible_mounts | selectattr('mount','equalto','/') | first }}"

    - name: Record install dir check
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        install_bytes: "{{ root_mount.size_available | int }}"
        result:
          requirement: "Install dir space (~/) "
          desired: ">= 15GB free"
          observed: "{{ (install_bytes | int / 1024 / 1024 / 1024) | round(2) }} GB"
          status: "{{ 'PASS' if (install_bytes | int) >= min_install_bytes else 'FAIL' }}"

    ############################################################
    # PODMAN CHECK
    ############################################################
    - name: Check podman
      command: podman --version
      register: podman_check
      ignore_errors: true
      changed_when: false

    - name: Record podman result
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "Podman"
          desired: "Podman available"
          observed: "{{ podman_check.stdout | default('not installed') }}"
          status: "{{ 'PASS' if podman_check.rc == 0 else 'WARN' }}"

    ############################################################
    # ANSIBLE-CORE CHECK
    ############################################################
    - name: Check ansible-core
      command: rpm -q ansible-core
      register: ansible_core_check
      ignore_errors: true
      changed_when: false

    - name: Record ansible-core result
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "ansible-core"
          desired: "Installed"
          observed: "{{ ansible_core_check.stdout | default('not installed') }}"
          status: "{{ 'PASS' if ansible_core_check.rc == 0 else 'FAIL' }}"

    ############################################################
    # CHECK FOR AAP SETUP BUNDLE IN files/
    ############################################################
    - name: Check files directory exists
      stat:
        path: "{{ playbook_dir }}/files"
      register: files_dir
    
    - name: Find large files (>3GB) in files directory
      find:
        paths: "{{ playbook_dir }}/files"
        recurse: no
        size: 3g
      register: large_files
      when: files_dir.stat.exists
    
    - name: Filter setup bundle files
      set_fact:
        setup_bundle_files: >-
          {{
            (large_files.files | default([]))
            | selectattr('path', 'search', 'setup.*bundle')
            | selectattr('path', 'search', '.tar.gz')
            | list
          }}
    
    - name: Determine setup bundle status
      set_fact:
        setup_bundle_status: "{{ 'PASS' if setup_bundle_files | length > 0 else 'FAIL' }}"
        setup_bundle_observed: >-
          {{
            setup_bundle_files[0].path
            if setup_bundle_files | length > 0
            else 'No setup bundle tar.gz (>3GB) found in files/ directory'
          }}
    
    - name: Record setup bundle result
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "AAP Setup Bundle"
          desired: "files/ansible-automation-platform-setup-bundle-*.tar.gz (>3GB)"
          observed: "{{ setup_bundle_observed }}"
          status: "{{ setup_bundle_status }}"

    ############################################################
    # CHECK FOR MANIFEST ZIP IN files/
    ############################################################
  
    - name: Find manifest zip files in files directory
      find:
        paths: "{{ playbook_dir }}/files"
        recurse: no
        patterns: "manifest_*.zip"
      register: manifest_files
      when: files_dir.stat.exists
    
    - name: Determine manifest file status
      set_fact:
        manifest_status: "{{ 'PASS' if (manifest_files.files | default([])) | length > 0 else 'FAIL' }}"
        manifest_observed: >-
          {{
            manifest_files.files[0].path
            if (manifest_files.files | default([])) | length > 0
            else 'No manifest_*.zip file found in files/ directory'
          }}
    
    - name: Record manifest result
      set_fact:
        precheck_results: "{{ precheck_results + [ result ] }}"
      vars:
        result:
          requirement: "AAP Manifest File"
          desired: "files/manifest_*.zip"
          observed: "{{ manifest_observed }}"
          status: "{{ manifest_status }}"

    ############################################################
    # FINAL REPORT (BUILD)
    ############################################################
    - name: Generate precheck report from template
      template:
        src: templates/aap_precheck_report.j2
        dest: /tmp/aap_precheck_report.txt

    - name: Display report (clean formatting)
      shell: cat /tmp/aap_precheck_report.txt
      register: report_output
    
    - name: Print report line-by-line
      debug:
        msg: "{{ report_output.stdout_lines }}"