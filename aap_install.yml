---
- name: Launch AAP installer in a persistent tmux split-screen session
  hosts: all
  become: true
  gather_facts: false

  vars:
    aap_setup_dir: "{{ hostvars[inventory_hostname].aap_setup_dir_for_install }}"
    install_user: "{{ hostvars[inventory_hostname].install_user_for_install }}"
    tmux_session: aap-install

  tasks:
    - name: Install tmux if missing
      ansible.builtin.dnf:
        name: tmux
        state: present

    - name: Kill any existing tmux session with the same name
      ansible.builtin.command: tmux kill-session -t {{ tmux_session }}
      become: false
      ignore_errors: true
      changed_when: false

    - name: Create tmux session with split-screen and attach
      ansible.builtin.shell: |
        tmux new-session -d -s {{ tmux_session }} -c "{{ aap_setup_dir }}"
        tmux send-keys -t {{ tmux_session }} \
          "ansible-playbook -i inventory-growth ansible.containerized_installer.install; exec bash" Enter
        tmux split-window -t {{ tmux_session }} -h -c "{{ aap_setup_dir }}"
        tmux select-pane -t {{ tmux_session }}:0.0
        if (exec < /dev/tty) 2>/dev/null; then
          tmux attach-session -t {{ tmux_session }} < /dev/tty > /dev/tty 2>&1
        else
          echo ""
          echo "================================================================"
          echo " Installer is running in tmux session '{{ tmux_session }}'"
          echo " No TTY available for auto-attach."
          echo " Run the following to connect:"
          echo "   tmux attach -t {{ tmux_session }}"
          echo "================================================================"
        fi
      become: false
      # Exits cleanly on detach (Ctrl+B D) or prints attach instructions if no TTY.
      changed_when: false
