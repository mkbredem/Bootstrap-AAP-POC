---
- name: Launch AAP installer in a persistent tmux split-screen session
  hosts: all
  become: true
  gather_facts: false

  vars:
    aap_setup_dir: "{{ hostvars[inventory_hostname].aap_setup_dir_for_install }}"
    install_user: "{{ hostvars[inventory_hostname].install_user_for_install }}"
    tmux_session: aap-install

  tasks:
    - name: Install tmux if missing
      ansible.builtin.dnf:
        name: tmux
        state: present

    - name: Kill any existing tmux session with the same name
      ansible.builtin.command: tmux kill-session -t {{ tmux_session }}
      become: false
      ignore_errors: true
      changed_when: false

    - name: Create tmux split-screen session
      ansible.builtin.shell: |
        tmux new-session -d -s {{ tmux_session }} -c "{{ aap_setup_dir }}"
        tmux send-keys -t {{ tmux_session }} \
          "ansible-playbook -i inventory-growth ansible.containerized_installer.install; exec bash" Enter
        tmux split-window -t {{ tmux_session }} -h -c "{{ aap_setup_dir }}"
        tmux select-pane -t {{ tmux_session }}:0.0
      become: false
      changed_when: false

    - name: Attach to tmux session
      ansible.builtin.shell: tmux attach-session -t {{ tmux_session }} < /dev/tty > /dev/tty 2>&1
      become: false
      changed_when: false
      ignore_errors: true
      register: tmux_attach

    - name: Show manual attach instructions (no TTY available for auto-attach)
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - " Installer is running in tmux session '{{ tmux_session }}'"
          - " Run the following command to connect:"
          - "   tmux attach -t {{ tmux_session }}"
          - " Ctrl+B D to detach (installer keeps running)"
          - "================================================================"
      when: tmux_attach is failed
