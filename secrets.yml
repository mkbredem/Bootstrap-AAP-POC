# This file will be ansible-vault encrypted during installation.
# The encryption password is the value of aap_password below — remember it!

# --- Required ---
aap_user: admin
aap_password: <CHANGE_ME>         # AAP admin password; also used to encrypt this file
aap_fqdn: <CHANGE_ME>             # FQDN of the host where AAP will be installed (e.g. aap.example.com)

# --- Optional: RHSM Registration ---
# If the host is not yet registered, provide ONE of the following auth methods.
# Leave all blank if the host is already subscribed.
#
# Method 1: Activation key (preferred for automation)
# rhsm_org: <YOUR_ORG_ID>
# rhsm_activation_key: <YOUR_ACTIVATION_KEY>
#
# Method 2: Username + password
# rhsm_username: <YOUR_REDHAT_USERNAME>
# rhsm_password: <YOUR_REDHAT_PASSWORD>
