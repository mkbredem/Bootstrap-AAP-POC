---
# Single entry-point for the full AAP POC bootstrap.
# Usage: ansible-playbook -i aap_precheck_inventory site.yml
#
# Skip precheck on reruns:
#   ansible-playbook -i aap_precheck_inventory site.yml --skip-tags precheck
#
# Relaunch installer session only (after manual fixes inside the tmux session):
#   ansible-playbook -i aap_precheck_inventory site.yml --skip-tags precheck,prep
#
# Re-run CaC seeding only (skips install, re-renders CaC files and reruns postinstall):
#   ansible-playbook -i aap_precheck_inventory site.yml --tags seed

- name: Import AAP precheck
  ansible.builtin.import_playbook: aap_precheck.yml
  tags: precheck

- name: Import AAP install prep
  ansible.builtin.import_playbook: aap_install_prep.yml
  tags: prep


##############################################
# Launch AAP installer in a tmux split-screen
##############################################
- name: Launch AAP installer in a persistent tmux split-screen session
  hosts: all
  become: true
  gather_facts: false
  tags: install

  vars:
    aap_setup_dir: "{{ hostvars[inventory_hostname].aap_setup_dir_for_install }}"
    install_user: "{{ hostvars[inventory_hostname].install_user_for_install }}"
    tmux_session: aap-install

  tasks:
    - name: Install tmux if missing
      ansible.builtin.dnf:
        name: tmux
        state: present

    - name: Kill any existing tmux session with the same name
      ansible.builtin.command: tmux kill-session -t {{ tmux_session }}
      become: false
      ignore_errors: true
      changed_when: false

    - name: Create tmux session with split-screen and attach
      ansible.builtin.shell: |
        tmux new-session -d -s {{ tmux_session }} -c "{{ aap_setup_dir }}"
        tmux send-keys -t {{ tmux_session }} \
          "ansible-playbook -i inventory-growth ansible.containerized_installer.install; exec bash" Enter
        tmux split-window -t {{ tmux_session }} -h -c "{{ aap_setup_dir }}"
        tmux select-pane -t {{ tmux_session }}:0.0
        tmux attach-session -t {{ tmux_session }} < /dev/tty > /dev/tty 2>&1
      become: false
      # The shell exits cleanly when the user detaches (Ctrl+B D).
      # The installer keeps running in the background.
      changed_when: false


##############################################
# Re-run CaC seeding only (--tags seed)
##############################################
- name: Re-seed AAP Controller resources via CaC postinstall
  hosts: all
  become: true
  gather_facts: true
  tags:
    - seed
    - never    # only runs when explicitly called with --tags seed

  vars_files:
    - secrets.yml

  vars:
    install_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    tmux_session: aap-seed

  tasks:
    - name: Find extracted setup directory
      ansible.builtin.find:
        paths: "/home/{{ install_user }}"
        file_type: directory
        patterns: "ansible-automation-platform-containerized-*"
      register: extracted_dir

    - name: Fail if setup directory not found
      ansible.builtin.assert:
        that: extracted_dir.files | length > 0
        fail_msg: "AAP setup directory not found under /home/{{ install_user }}/ — run the full install first."

    - name: Set setup directory path
      ansible.builtin.set_fact:
        aap_setup_dir: "{{ extracted_dir.files[0].path }}"

    - name: Re-render CaC templates into setup directory
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ aap_setup_dir }}/cac/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: "{{ install_user }}"
        group: "{{ install_user }}"
        mode: '0644'
      with_fileglob:
        - "{{ playbook_dir }}/files/cac/*.yaml.j2"

    - name: Kill any existing seed tmux session
      ansible.builtin.command: tmux kill-session -t {{ tmux_session }}
      become: false
      ignore_errors: true
      changed_when: false

    - name: Launch seeding in tmux split-screen
      ansible.builtin.shell: |
        tmux new-session -d -s {{ tmux_session }} -c "{{ aap_setup_dir }}"
        tmux send-keys -t {{ tmux_session }} \
          "ansible-playbook -i inventory-growth ansible.containerized_installer.install --tags controller_postinstall; exec bash" Enter
        tmux split-window -t {{ tmux_session }} -h -c "{{ aap_setup_dir }}"
        tmux select-pane -t {{ tmux_session }}:0.0
        tmux attach-session -t {{ tmux_session }} < /dev/tty > /dev/tty 2>&1
      become: false
      changed_when: false
